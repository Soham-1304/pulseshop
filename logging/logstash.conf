input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
    skip_on_invalid_json => true
  }

  mutate {
    add_field => { "application" => "pulseshop-commerce" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pulseshop-logs-%{+YYYY.MM.dd}"
  }

  if [level] == "error" {
    http {
      url => "${PATCHUP_WEBHOOK_URL}/api/webhooks/incident-bundle"
      http_method => "post"
      format => "json"
      content_type => "application/json"
    }
  }
}

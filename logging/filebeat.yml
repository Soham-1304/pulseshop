filebeat.inputs:
  - type: container
    paths:
      - '/var/lib/docker/containers/*/*.log'
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true

processors:
  - drop_event:
      when:
        not:
          or:
            - contains:
                container.name: "pulseshop-gateway"
            - contains:
                container.name: "pulseshop-orders"
            - contains:
                container.name: "pulseshop-payments"

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  upstream gateway_upstream {
    server gateway:4000;
  }

  # Canary upstream pool for orders service (90% v1, 10% v2 when canary profile is active)
  upstream orders_canary_pool {
    server orders:4001 weight=9;
    # Uncomment or dynamically reload via deploy gate when orders-v2 canary container is running:
    # server orders-v2:4001 weight=1;
  }

  upstream frontend_upstream {
    server frontend:80;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://gateway_upstream/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /metrics {
      proxy_pass http://gateway_upstream/metrics;
    }

    location = /health {
      proxy_pass http://gateway_upstream/health;
    }

    location / {
      proxy_pass http://frontend_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
